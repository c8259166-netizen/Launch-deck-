name: Build Launch deck APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        working-directory: Launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleSideloadDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LaunchDeck-apk
          path: Launcher/App/build/outputs/apk/sideload/debug/*.apk
